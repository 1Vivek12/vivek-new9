services:
  postgres:
    image: postgres:16-alpine
    container_name: news9-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news9_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d news9_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: news9-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: news9-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DEBUG: "false"
      APP_NAME: "News 9 AI Content & Newsroom Automation Platform"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres_dev_password@postgres:5432/news9_platform"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      SECRET_KEY: "CHANGE_IN_PRODUCTION_SUPER_SECRET_KEY_MIN_32"
      STORAGE_ROOT: "/app/data/storage"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      AI_PROVIDER_TYPE: "ollama"
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/data/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: news9-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres_dev_password@postgres:5432/news9_platform"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      SECRET_KEY: "CHANGE_IN_PRODUCTION_SUPER_SECRET_KEY_MIN_32"
      STORAGE_ROOT: "/app/data/storage"
    volumes:
      - storage_data:/app/data/storage

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: news9-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  storage_data:
